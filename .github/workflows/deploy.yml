name: Deploy to Hostinger

on:
  push:
    branches:
      - main

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install lftp
        run: sudo apt-get install -y lftp

      - name: Prepare Studio authentication
        env:
          JB_CMS_PASSWORD_HASH: ${{ secrets.JB_CMS_PASSWORD_HASH }}
        run: |
          mkdir -p .deploy-private
          php -r 'file_put_contents(".deploy-private/auth.json", json_encode(["password_hash" => getenv("JB_CMS_PASSWORD_HASH")], JSON_PRETTY_PRINT | JSON_UNESCAPED_SLASHES) . PHP_EOL);'

      - name: Deploy via FTP to Hostinger
        env:
          FTP_HOST: 157.173.214.227
          FTP_USER: u335085697
          FTP_PASS: ${{ secrets.FTP_PASSWORD }}
        run: |
          lftp -c "
            set ftp:ssl-allow yes;
            set ftp:ssl-force no;
            set ssl:verify-certificate no;
            set ftp:passive-mode yes;
            set net:timeout 30;
            set net:max-retries 3;
            set net:reconnect-interval-base 5;
            open ftp://$FTP_USER:$FTP_PASS@$FTP_HOST;
            cd /domains/jakebartoncreative.com/public_html/;
            put -O . ./_public_html/.htaccess ./_public_html/index.php ./_public_html/home.php ./_public_html/router.php ./_public_html/contact-handler.php;
            mirror --reverse --verbose ./_public_html/includes/ ./includes/;
            mirror --reverse --verbose ./_public_html/studio/ ./studio/;
            mirror --reverse --verbose ./_public_html/work/ ./work/;
            mirror --reverse --verbose ./_public_html/assets/brand/ ./assets/brand/;
            mirror --reverse --verbose ./_public_html/assets/css/ ./assets/css/;
            mirror --reverse --verbose ./_public_html/assets/documents/ ./assets/documents/;
            mirror --reverse --verbose ./_public_html/assets/fonts/ ./assets/fonts/;
            mirror --reverse --verbose ./_public_html/assets/home/ ./assets/home/;
            mirror --reverse --verbose ./_public_html/assets/js/ ./assets/js/;
            mirror --reverse --verbose ./_public_html/assets/organizations/ ./assets/organizations/;
            mirror --reverse --verbose ./_public_html/assets/project-covers/ ./assets/project-covers/;
            mirror --reverse --verbose ./_public_html/assets/uploads/ ./assets/uploads/;
            mirror --reverse --verbose ./_public_html/assets/work/ ./assets/work/;
            mkdir -p ../storage/cms/pages;
            put -O ../storage/cms ./storage/cms/blueprint.json;
            put -O ../storage/cms ./.deploy-private/auth.json;
            mirror --reverse --verbose ./storage/cms/pages/ ../storage/cms/pages/;
            bye
          "
