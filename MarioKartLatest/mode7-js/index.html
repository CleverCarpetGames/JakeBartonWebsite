<!DOCTYPE html>
<html>
<head>
    <title>Super Mario Kart - Redesigned</title>
    <!-- Mobile viewport — prevents zoom/scroll on touch -->
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <!-- Disable caching during development -->
    <meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate">
    <meta http-equiv="Pragma" content="no-cache">
    <meta http-equiv="Expires" content="0">
    <!-- iOS full-screen / PWA hints -->
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
    <meta name="mobile-web-app-capable" content="yes">
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        html, body {
            background: #000;
            overflow: hidden;
            /* Prevent rubber-band scrolling on iOS */
            overscroll-behavior: none;
            touch-action: none;
            height: 100%;
            width: 100%;
        }
        body {
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100dvh;
            width: 100vw;
        }
        canvas {
            image-rendering: pixelated;
            image-rendering: crisp-edges;
            image-rendering: -moz-crisp-edges;
            -ms-interpolation-mode: nearest-neighbor;

            /* Fill height; pillarboxes appear naturally on wide phones */
            width: auto;
            height: 100dvh;
            max-width: 100vw;
            max-height: 100dvh;

            border: 2px solid #333;
            /* Canvas itself should not handle touch — MobileControls does */
            touch-action: none;
        }
    </style>
</head>
<body>
    <canvas id="gameCanvas"></canvas>
    <!-- Auto cache-busting: loads fresh game.js every time -->
    <script type="module">
        import('./game.js?t=' + new Date().getTime());
    </script>
</body>
</html>
